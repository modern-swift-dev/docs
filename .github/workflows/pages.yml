name: Build and deploy documentation

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: calder-swiftui
            ref: main
            build: make site-setup && npm --prefix Website run check && make site-build && make site-check
          - module: lockbox-swift
            ref: main
            build: make site-validate
          - module: mocksmith-swift
            ref: main
            build: make site-build
          - module: pathways-swift
            ref: main
            build: make site-setup && make site-build
          - module: roundtrip-swift
            ref: main
            build: make site-setup && make site && make internal-link
          - module: skein-swift
            ref: main
            build: make site-setup && npm --prefix Website run check && make site-build && make site-check
          - module: swift-markdown-ui
            ref: develop
            build: make site-validate
          - module: swift-snapshot-testing
            ref: main
            build: make website-install && make site-build && make site-check
          - module: swift-stash
            ref: main
            build: make site-setup && make site-build && make site-validate
          - module: taskloom-swift
            ref: main
            build: make site-setup && npm --prefix Website run check && make site-build && make site-check
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
        with:
          repository: modern-swift-dev/${{ matrix.module }}
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Website/package-lock.json
      - name: Build and validate module site
        run: ${{ matrix.build }}
      - name: Require generated site
        run: test -f .build/site/index.html
      - uses: actions/upload-artifact@v7
        with:
          name: site-${{ matrix.module }}
          path: .build/site
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  assemble:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: site-*
          path: .build/modules
      - name: Assemble documentation site
        run: python3 scripts/assemble.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .build/site
          include-hidden-files: true
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request'
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5
