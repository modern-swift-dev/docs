name: Build and deploy documentation

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false

jobs:
  modules:
    runs-on: depot-ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Test release metadata lookup
        run: node --experimental-strip-types --test scripts/release.test.ts
      - id: matrix
        name: Read module registry
        run: |
          node --experimental-strip-types --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { modules } from './src/data/modules.ts';
          const include = modules.map(({ id, branch }) => ({ module: id, ref: branch }));
          appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);
          JS

  build:
    needs: modules
    runs-on: depot-macos-26
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.modules.outputs.matrix) }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out the documentation app
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check out module sources
        uses: actions/checkout@v6
        with:
          repository: modern-swift-dev/${{ matrix.module }}
          ref: ${{ matrix.ref }}
          path: .build/sources/${{ matrix.module }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Prepare module Markdown and source examples
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MODULE: ${{ matrix.module }}
        run: node --experimental-strip-types scripts/prepare-content.ts "$MODULE"
      - name: Generate Apple DocC API references
        env:
          MODULE: ${{ matrix.module }}
        run: node --experimental-strip-types scripts/build-api.ts "$MODULE"
      - name: Package module documentation
        env:
          MODULE: ${{ matrix.module }}
          COPYFILE_DISABLE: "1"
        run: tar -cf ".build/module-$MODULE.tar" -C .build "api/$MODULE" "content/$MODULE"
      - uses: actions/upload-artifact@v7
        with:
          name: module-${{ matrix.module }}
          path: .build/module-${{ matrix.module }}.tar
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  assemble:
    needs: build
    runs-on: depot-ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: module-*
          path: .build
          merge-multiple: true
      - name: Extract module documentation
        run: |
          for archive in .build/module-*.tar; do
            tar -xf "$archive" -C .build
            rm "$archive"
          done
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Build the shared Astro website
        run: |
          npm ci
          npm run check
          npm run build:guides
          npm run assemble
          npm run check:links
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .build/site
          include-hidden-files: true
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request'
    needs: assemble
    runs-on: depot-ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5
